# Builds the three Android apps (Customer, Technician, Office) from mobile/ on GitHub's computers.
# Runs when anything in mobile/ changes, or by hand: GitHub → Actions → "Android app" → Run workflow.
# The apps appear under the run's "Artifacts" (and as a release when you push a tag like app-v1).
name: Android app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-app.yml']
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      SITE_URL: ${{ vars.SITE_URL }}          # Optional: overrides siteUrl in mobile/capacitor.config.json
      CUSTOMER_APP_NAME: ${{ vars.CUSTOMER_APP_NAME }}
      TECH_APP_NAME: ${{ vars.TECH_APP_NAME }}
      OFFICE_APP_NAME: ${{ vars.OFFICE_APP_NAME }}
      HAS_PUSH: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install (npm install)
        run: npm install

      - name: Firebase config for push notifications (optional)
        if: env.HAS_PUSH == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Signing key for Play Store builds (optional)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build test apps (APKs to install directly)
        run: npm run build

      - name: Build Play Store apps (signed APK and AAB)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: npm run release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apps-${{ github.run_number }}
          path: mobile/dist/*

      - name: Publish a release for tags like app-v1
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/dist/*
