# Builds the three Android apps (Customer, Technician, Office) on GitHub's computers.
# You can also build them yourself in Android Studio: open the android folder (see README).
# Runs when anything in android/ changes, or by hand: GitHub → Actions → "Android app" → Run workflow.
# The app files appear under the run's "Artifacts" (and as a release when you push a tag like app-v1).
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-app.yml']
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}          # Optional: overrides SITE_URL in android/gradle.properties
      CUSTOMER_APP_NAME: ${{ vars.CUSTOMER_APP_NAME }}
      TECH_APP_NAME: ${{ vars.TECH_APP_NAME }}
      OFFICE_APP_NAME: ${{ vars.OFFICE_APP_NAME }}
      HAS_PUSH: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Website
        run: |
          echo "Website: ${SITE_URL:-$(grep '^SITE_URL=' android/gradle.properties | cut -d= -f2-)}"

      - name: Firebase config for push notifications (optional)
        if: env.HAS_PUSH == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Signing key for Play Store builds (optional)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build test apps (APKs to install directly)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build Play Store app (signed APK and AAB)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect app files
        run: |
          mkdir -p out
          for f in customer tech office; do
            cp android/app/build/outputs/apk/$f/debug/app-$f-debug.apk out/ac-$f-test.apk
            if [ "$HAS_KEY" = "true" ]; then
              cp android/app/build/outputs/apk/$f/release/app-$f-release.apk out/ac-$f.apk
              cp android/app/build/outputs/bundle/${f}Release/app-$f-release.aab out/ac-$f-play-store.aab
            fi
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ac-service-android-${{ github.run_number }}
          path: out/*

      - name: Publish a release for tags like app-v1
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
